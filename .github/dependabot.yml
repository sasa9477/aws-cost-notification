version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    groups:
      major:
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      # リリースから7日が経過していないパッケージは更新しない
      default-days: 7
    ignore:
      - dependency-name: "typescript"
        # ts-node and ts-jest are not compatible with the TypeScript 7.0 Compiler API.
        versions: ["7.0.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
      time: "10:00"
      timezone: "Asia/Tokyo"
    cooldown:
      # リリースから7日が経過していないパッケージは更新しない
      default-days: 7
