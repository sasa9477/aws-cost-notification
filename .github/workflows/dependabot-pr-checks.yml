# dependabot PR 作成時にテストを実行し、レビュアーにリポジトリオーナーを設定する

name: Dependabot PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dependabot-pr-checks:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
          run_install: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

      - name: Synth
        run: pnpm run synth
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          LINE_CHANNEL_ID: "dummy"
          LINE_CHANNEL_SECRET: "dummy"
          LINE_USER_ID: "dummy"

      - name: Add repository owner as reviewer
        if: ${{ always() }}
        run: gh pr edit "$PR_URL" --add-reviewer "$OWNER"
        env:
          OWNER: ${{ github.repository_owner }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
